<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مولّد بطاقات التهنئة بالنجاح — فهد رفاعي</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Cairo',sans-serif;direction:rtl;background:#f4f3f8;min-height:100vh}

    .top-bar{background:#fff;border-bottom:1px solid #e5e7eb;padding:1rem 1.5rem;display:flex;align-items:center;gap:12px}
    .dot{width:9px;height:9px;border-radius:50%;background:#7c3aed;flex-shrink:0}
    .top-bar-title{font-size:17px;font-weight:700;color:#111}
    .top-bar-sub{font-size:13px;color:#6b7280}

    .body{display:grid;grid-template-columns:320px 1fr;min-height:calc(100vh - 61px)}
    @media(max-width:700px){.body{grid-template-columns:1fr}}

    .sidebar{background:#fff;border-left:1px solid #e5e7eb;padding:1.25rem;display:flex;flex-direction:column;gap:1rem;overflow-y:auto}

    .section-title{font-size:11px;font-weight:600;color:#9ca3af;letter-spacing:.8px;margin-bottom:.5rem}

    .occ-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
    .occ-btn{background:#f9fafb;border:1px solid #e5e7eb;border-radius:10px;padding:8px 6px;cursor:pointer;text-align:center;transition:all .15s;font-family:'Cairo',sans-serif}
    .occ-btn .occ-icon{font-size:20px;display:block;margin-bottom:3px}
    .occ-btn .occ-label{font-size:11px;color:#6b7280}
    .occ-btn.sel{border-color:#7c3aed;background:#f5f3ff}
    .occ-btn.sel .occ-label{color:#7c3aed;font-weight:600}

    label{display:block;font-size:12px;color:#6b7280;margin-bottom:5px}
    input,textarea{width:100%;font-family:'Cairo',sans-serif;font-size:13px;padding:8px 12px;border:1px solid #e5e7eb;border-radius:8px;background:#f9fafb;color:#111;outline:none;transition:border-color .15s}
    input:focus,textarea:focus{border-color:#7c3aed;background:#fff}
    textarea{height:64px;resize:none}

    .palette-row{display:flex;gap:8px;flex-wrap:wrap}
    .pal{width:32px;height:32px;border-radius:50%;cursor:pointer;border:2.5px solid transparent;transition:transform .15s}
    .pal.sel{border-color:#111;transform:scale(1.15)}

    .gen-btn{width:100%;padding:.8rem;background:#7c3aed;color:#fff;border:none;border-radius:10px;font-family:'Cairo',sans-serif;font-size:15px;font-weight:700;cursor:pointer;transition:background .15s;display:flex;align-items:center;justify-content:center;gap:8px}
    .gen-btn:hover{background:#6d28d9}

    .canvas-area{padding:2rem;display:flex;flex-direction:column;align-items:center;gap:1rem;background:#f4f3f8}

    canvas#cardCanvas{border-radius:20px;max-width:100%;box-shadow:0 20px 60px rgba(0,0,0,.18);cursor:pointer}

    .action-row{display:flex;gap:8px;width:100%;max-width:420px;flex-wrap:wrap}
    .act-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:.55rem .75rem;border-radius:8px;font-family:'Cairo',sans-serif;font-size:13px;font-weight:600;cursor:pointer;border:1px solid #e5e7eb;background:#fff;color:#374151;transition:background .15s;min-width:80px}
    .act-btn:hover{background:#f3f4f6}
    .act-btn.wa{background:#25D366;color:#fff;border-color:#25D366}
    .act-btn.wa:hover{background:#22c55e}
    .act-btn.tw{background:#000;color:#fff;border-color:#000}

    .hint{font-size:13px;color:#9ca3af;text-align:center;padding-top:.5rem}

    #cfc{position:fixed;inset:0;pointer-events:none;z-index:9999}

    footer{text-align:center;padding:1rem;font-size:12px;color:#9ca3af;background:#f4f3f8}
    footer a{color:#7c3aed;text-decoration:none}
  </style>
</head>
<body>

<canvas id="cfc"></canvas>

<div class="top-bar">
  <div class="dot"></div>
  <div>
    <div class="top-bar-title">مولّد بطاقات التهنئة</div>
    <div class="top-bar-sub">صمّم بطاقتك وشاركها فوراً</div>
  </div>
</div>

<div class="body">
  <div class="sidebar">

    <div>
      <div class="section-title">المناسبة</div>
      <div class="occ-grid" id="occGrid">
        <div class="occ-btn sel" data-occ="grad" onclick="pickOcc(this)"><span class="occ-icon">🎓</span><span class="occ-label">تخرج</span></div>
        <div class="occ-btn" data-occ="pass" onclick="pickOcc(this)"><span class="occ-icon">✅</span><span class="occ-label">اجتياز اختبار</span></div>
        <div class="occ-btn" data-occ="cert" onclick="pickOcc(this)"><span class="occ-icon">📜</span><span class="occ-label">شهادة</span></div>
        <div class="occ-btn" data-occ="promo" onclick="pickOcc(this)"><span class="occ-icon">⭐</span><span class="occ-label">ترقية</span></div>
        <div class="occ-btn" data-occ="job" onclick="pickOcc(this)"><span class="occ-icon">💼</span><span class="occ-label">وظيفة جديدة</span></div>
        <div class="occ-btn" data-occ="award" onclick="pickOcc(this)"><span class="occ-icon">🏆</span><span class="occ-label">جائزة وتميز</span></div>
        <div class="occ-btn" data-occ="course" onclick="pickOcc(this)"><span class="occ-icon">📚</span><span class="occ-label">إتمام دورة</span></div>
        <div class="occ-btn" data-occ="win" onclick="pickOcc(this)"><span class="occ-icon">🚀</span><span class="occ-label">نجاح عام</span></div>
      </div>
    </div>

    <div>
      <label>اسم المُهنَّأ</label>
      <input type="text" id="nameInp" placeholder="مثال: محمد العمري" maxlength="40">
    </div>

    <div>
      <label>التخصص / المجال (اختياري)</label>
      <input type="text" id="fieldInp" placeholder="مثال: هندسة الكهرباء" maxlength="40">
    </div>

    <div>
      <label>رسالة خاصة (اختياري)</label>
      <textarea id="msgInp" placeholder="وفقك الله وبارك في مسيرتك…" maxlength="100"></textarea>
    </div>

    <div>
      <div class="section-title">لون البطاقة</div>
      <div class="palette-row" id="palRow"></div>
    </div>

    <button class="gen-btn" onclick="generate()">
      <i class="ti ti-sparkles" style="font-size:17px"></i>
      ولّد البطاقة
    </button>

  </div>

  <div class="canvas-area">
    <canvas id="cardCanvas" width="800" height="800"></canvas>
    <div class="action-row" id="actRow" style="display:none">
      <button class="act-btn" onclick="downloadCard()">
        <i class="ti ti-download" style="font-size:15px"></i> تحميل PNG
      </button>
      <button class="act-btn wa" onclick="shareWa()">
        <i class="ti ti-brand-whatsapp" style="font-size:15px"></i> واتساب
      </button>
      <button class="act-btn tw" onclick="shareTw()">
        <i class="ti ti-brand-x" style="font-size:15px"></i> X
      </button>
    </div>
    <div class="hint" id="hint">اختر المناسبة ثم اضغط "ولّد البطاقة"</div>
  </div>
</div>

<footer>
  المدرب فهد رفاعي — <a href="https://fahdacademy.org" target="_blank">fahdacademy.org</a>
</footer>

<script>
const PALETTES = [
  { name:'بنفسجي',  bg:['#1e1040','#3b1d78','#6d28d9'], accent:'#a78bfa', gold:'#f5d07a' },
  { name:'أزرق',   bg:['#0a1628','#1e3a5f','#1d4ed8'], accent:'#60a5fa', gold:'#fbbf24' },
  { name:'أخضر',   bg:['#0a1f0f','#0d4f2f','#047857'], accent:'#6ee7b7', gold:'#fde68a' },
  { name:'ذهبي',   bg:['#1c1005','#3d2809','#92400e'], accent:'#fcd34d', gold:'#fff'    },
  { name:'وردي',   bg:['#1a0520','#4a1040','#9d174d'], accent:'#f9a8d4', gold:'#fef08a' },
  { name:'فيروزي', bg:['#041212','#0c3535','#0f766e'], accent:'#5eead4', gold:'#fef08a' },
];

const OCCASIONS = {
  grad:  { icon:'🎓', title:'مبروك التخرج',              sub:'رحلة النجاح بدأت' },
  pass:  { icon:'✅', title:'مبروك اجتياز الاختبار',      sub:'تستحق كل التقدير' },
  cert:  { icon:'📜', title:'مبروك الحصول على الشهادة',   sub:'شهادة تعكس جهدك' },
  promo: { icon:'⭐', title:'مبروك الترقية',               sub:'استحققتها بجدارة' },
  job:   { icon:'💼', title:'مبروك الوظيفة الجديدة',      sub:'بداية مشوار جميل' },
  award: { icon:'🏆', title:'مبروك الجائزة',               sub:'تميز حقيقي' },
  course:{ icon:'📚', title:'مبروك إتمام الدورة',          sub:'علم يضاف لرصيدك' },
  win:   { icon:'🚀', title:'مبروك النجاح',                sub:'إلى الأمام دائماً' },
};

let selOcc = 'grad', selPal = 0, shareText = '';

function pickOcc(el) {
  document.querySelectorAll('.occ-btn').forEach(b=>b.classList.remove('sel'));
  el.classList.add('sel');
  selOcc = el.dataset.occ;
}

const palRow = document.getElementById('palRow');
PALETTES.forEach((p,i) => {
  const d = document.createElement('div');
  d.className = 'pal'+(i===0?' sel':'');
  d.style.background = `linear-gradient(135deg,${p.bg[0]},${p.bg[2]})`;
  d.title = p.name;
  d.onclick = () => { document.querySelectorAll('.pal').forEach(x=>x.classList.remove('sel')); d.classList.add('sel'); selPal=i; };
  palRow.appendChild(d);
});

function generate() {
  const occ = OCCASIONS[selOcc];
  const pal = PALETTES[selPal];
  const name  = document.getElementById('nameInp').value.trim();
  const field = document.getElementById('fieldInp').value.trim();
  const msg   = document.getElementById('msgInp').value.trim() || 'وفقك الله وبارك في مسيرتك 🌟';
  drawCard(occ, pal, name, field, msg);
  document.getElementById('actRow').style.display = 'flex';
  document.getElementById('hint').style.display = 'none';
  shareText = `${occ.title}\n${name?'👤 '+name+'\n':''}${field?'📌 '+field+'\n':''}${msg}\n#تهنئة_بالنجاح`;
  launchConfetti();
}

function drawCard(occ, pal, name, field, msg) {
  const cv = document.getElementById('cardCanvas');
  const ctx = cv.getContext('2d');
  const W=800, H=800;
  ctx.clearRect(0,0,W,H);

  // BG
  const gBg = ctx.createLinearGradient(0,0,W,H);
  gBg.addColorStop(0, pal.bg[0]);
  gBg.addColorStop(0.5, pal.bg[1]);
  gBg.addColorStop(1, pal.bg[2]);
  ctx.fillStyle = gBg;
  roundRect(ctx,0,0,W,H,36); ctx.fill();

  // Deco circles
  ctx.save(); ctx.globalAlpha=0.07; ctx.strokeStyle=pal.accent; ctx.lineWidth=60;
  ctx.beginPath(); ctx.arc(W*.85,H*.15,220,0,Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.arc(W*.1,H*.85,160,0,Math.PI*2); ctx.stroke();
  ctx.restore();
  ctx.save(); ctx.globalAlpha=0.04; ctx.strokeStyle='#fff'; ctx.lineWidth=1;
  for(let r=80;r<400;r+=60){ ctx.beginPath(); ctx.arc(W*.85,H*.12,r,0,Math.PI*2); ctx.stroke(); }
  ctx.restore();

  // Top line
  const gL=ctx.createLinearGradient(60,0,W-60,0);
  gL.addColorStop(0,'transparent'); gL.addColorStop(.3,pal.accent); gL.addColorStop(.7,pal.gold); gL.addColorStop(1,'transparent');
  ctx.fillStyle=gL; ctx.fillRect(60,40,W-120,4);

  // Bottom line
  const gL2=ctx.createLinearGradient(60,0,W-60,0);
  gL2.addColorStop(0,'transparent'); gL2.addColorStop(.3,pal.gold); gL2.addColorStop(.7,pal.accent); gL2.addColorStop(1,'transparent');
  ctx.fillStyle=gL2; ctx.fillRect(60,H-44,W-120,4);

  // Badge
  ctx.save(); ctx.globalAlpha=.18; ctx.fillStyle=pal.accent;
  roundRect(ctx,W/2-130,80,260,44,22); ctx.fill(); ctx.restore();
  ctx.save(); ctx.globalAlpha=.4; ctx.strokeStyle=pal.accent; ctx.lineWidth=1;
  roundRect(ctx,W/2-130,80,260,44,22); ctx.stroke(); ctx.restore();
  ctx.fillStyle=pal.accent; ctx.font='500 22px Cairo,sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('تهنئة بالنجاح',W/2,102);

  // Icon
  ctx.font='120px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(occ.icon,W/2,270);

  // Sparkles
  const sp=[[W/2-120,200],[W/2+120,210],[W/2-100,340],[W/2+115,330],[W/2,170]];
  ctx.fillStyle=pal.gold;
  sp.forEach(([sx,sy],i)=>{ ctx.save(); ctx.globalAlpha=.5+(i%3)*.15; ctx.font=`${16+i*4}px serif`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('✦',sx,sy); ctx.restore(); });

  // Title
  ctx.fillStyle='#fff'; ctx.font='700 52px Cairo,sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  wrapText(ctx, occ.title, W/2, 385, W-120, 62);

  // Divider
  const gD=ctx.createLinearGradient(W/2-140,0,W/2+140,0);
  gD.addColorStop(0,'transparent'); gD.addColorStop(.5,pal.gold); gD.addColorStop(1,'transparent');
  ctx.fillStyle=gD; ctx.fillRect(W/2-140,440,280,2);

  // Name
  if(name){ ctx.fillStyle=pal.gold; ctx.font='600 40px Cairo,sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(name,W/2,490); }

  // Field
  if(field){
    ctx.font='400 24px Cairo,sans-serif';
    const fw=ctx.measureText('📌 '+field).width+40;
    ctx.save(); ctx.globalAlpha=.12; ctx.fillStyle='#fff'; roundRect(ctx,W/2-fw/2,530,fw,36,18); ctx.fill(); ctx.restore();
    ctx.fillStyle='rgba(255,255,255,0.7)'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('📌 '+field,W/2,548);
  }

  // Message
  ctx.fillStyle='rgba(255,255,255,0.72)'; ctx.font='400 26px Cairo,sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  const msgY = field?615 : name?575 : 540;
  wrapText(ctx, msg, W/2, msgY, W-160, 36);

  // Footer
  ctx.fillStyle='rgba(255,255,255,0.22)'; ctx.font='400 20px Cairo,sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('fahdacademy.org — المدرب فهد رفاعي',W/2,H-68);
}

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath(); ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h); ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r); ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
}

function wrapText(ctx,text,x,y,maxW,lineH){
  const words=text.split(' '); let line='',lines=[];
  for(let w of words){ const t=line?line+' '+w:w; if(ctx.measureText(t).width>maxW&&line){lines.push(line);line=w;}else line=t; }
  if(line)lines.push(line);
  const sy=y-((lines.length-1)*lineH)/2;
  lines.forEach((l,i)=>ctx.fillText(l,x,sy+i*lineH));
}

function downloadCard(){ const a=document.createElement('a'); a.download='congratulations.png'; a.href=document.getElementById('cardCanvas').toDataURL('image/png'); a.click(); }
function shareWa(){ window.open('https://api.whatsapp.com/send?text='+encodeURIComponent(shareText),'_blank'); }
function shareTw(){ window.open('https://twitter.com/intent/tweet?text='+encodeURIComponent(shareText),'_blank'); }

function launchConfetti(){
  const cv=document.getElementById('cfc'); cv.width=window.innerWidth; cv.height=window.innerHeight;
  const ctx=cv.getContext('2d');
  const cols=['#a78bfa','#60a5fa','#f5d07a','#6ee7b7','#f9a8d4','#fff','#fbbf24'];
  const ps=Array.from({length:120},()=>({x:Math.random()*cv.width,y:-10-Math.random()*cv.height*.3,w:Math.random()*10+4,h:Math.random()*5+2,c:cols[Math.floor(Math.random()*cols.length)],vy:Math.random()*3+1.5,vx:Math.random()*2-1,rot:Math.random()*360,rs:Math.random()*5-2.5,op:1}));
  let f=0;
  (function d(){ ctx.clearRect(0,0,cv.width,cv.height); ps.forEach(p=>{p.y+=p.vy;p.x+=p.vx;p.rot+=p.rs;if(f>70)p.op-=.01;ctx.save();ctx.globalAlpha=Math.max(0,p.op);ctx.translate(p.x+p.w/2,p.y+p.h/2);ctx.rotate(p.rot*Math.PI/180);ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();}); f++; if(f<180)requestAnimationFrame(d); else ctx.clearRect(0,0,cv.width,cv.height); })();
}
</script>
</body>
</html>
